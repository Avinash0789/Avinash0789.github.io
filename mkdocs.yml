site_name: Avinash Barik · Technical Writing Portfolio
site_url: https://avinash0789.github.io/
site_author: Avinash Barik
site_description: Technical writing portfolio – enterprise application documentation, process docs, SOPs, API references and AI knowledge bases.

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.tabs.link
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/file-document-edit-outline

nav:
  - Home: index.md
  - Writing samples:
      - Process documentation – Order-to-Cash: samples/order-to-cash.md
      - SOP – Raising a purchase request: samples/sop-purchase-request.md
      - API reference – Orders API: samples/api-reference.md
      - AI documentation – Knowledge base for an AI agent: samples/ai-knowledge-base.md
      - Release notes: samples/release-notes.md
      - Knowledge base article: samples/kb-article.md
  - Process streams:
      - Campaign-to-Order: streams/campaign-to-order.md
      - Order-to-Cash: samples/order-to-cash.md
      - Delivery Apps: streams/delivery-apps.md
      - Issue-to-Resolution: streams/issue-to-resolution.md
      - Plan-to-Produce: streams/plan-to-produce.md
      - Plan-to-Implement: streams/plan-to-implement.md
      - Hire-to-Retire: streams/hire-to-retire.md
  - Case studies:
      - Building a process documentation repository: case-studies/process-repository.md
      - Creating and training an AI knowledge agent: case-studies/ai-agent.md
  - GitHub activity: github.md
  - About me: about.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/avinash-barik-54a1ab194/
    - icon: fontawesome/brands/github
      link: https://github.com/Avinash0789

copyright: © 2026 Avinash Barik · Technical Writing Portfolio
